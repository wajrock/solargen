<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1190 760" role="img">
<title>SolarGen Prisma schema</title>
<desc>Entity relationship diagram of the solargen-backend Prisma schema: Installation has many Site, Site has many Prediction. Weather and ModelInfo are standalone tables with no relations.</desc>

<defs>
  <marker id="arrow2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M0,0 L10,5 L0,10 z" fill="#4b5563"/>
  </marker>
</defs>

<rect x="0" y="0" width="1190" height="760" rx="16" fill="#ffffff"/>

<!-- ================= Installation ================= -->
<rect x="80" y="80" width="250" height="190" rx="12" fill="#f1f5f9" stroke="#475569" stroke-width="1.8"/>
<text x="205" y="112" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="19" font-weight="700" fill="#1e293b">Installation</text>
<line x1="100" y1="126" x2="310" y2="126" stroke="#475569" stroke-width="1" opacity="0.3"/>

<text x="100" y="148" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#1e293b">id</text>
<text x="200" y="148" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#475569">Int (PK)</text>
<text x="100" y="167" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#1e293b">name</text>
<text x="200" y="167" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#475569">String</text>
<text x="100" y="186" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#1e293b">latitude</text>
<text x="200" y="186" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#475569">Float</text>
<text x="100" y="205" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#1e293b">longitude</text>
<text x="200" y="205" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#475569">Float</text>
<text x="100" y="224" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#1e293b">sites</text>
<text x="200" y="224" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#475569">Site[]</text>

<text x="100" y="252" font-family="Helvetica, Arial, sans-serif" font-size="12" font-style="italic" fill="#64748b">@@map("installation")</text>

<!-- ================= Site ================= -->
<rect x="430" y="80" width="250" height="240" rx="12" fill="#eaf2fc" stroke="#2563eb" stroke-width="1.8"/>
<text x="555" y="112" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="19" font-weight="700" fill="#1e3a8a">Site</text>
<line x1="450" y1="126" x2="660" y2="126" stroke="#2563eb" stroke-width="1" opacity="0.3"/>

<text x="450" y="148" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#1e3a8a">id</text>
<text x="595" y="148" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#1d4ed8">String (PK)</text>
<text x="450" y="167" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#1e3a8a">kwp</text>
<text x="595" y="167" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#1d4ed8">Float</text>
<text x="450" y="186" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#1e3a8a">panel_count</text>
<text x="595" y="186" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#1d4ed8">Int</text>
<text x="450" y="205" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#1e3a8a">panel_model</text>
<text x="595" y="205" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#1d4ed8">String</text>
<text x="450" y="224" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#1e3a8a">inverters</text>
<text x="595" y="224" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#1d4ed8">Json</text>
<text x="450" y="243" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#1e3a8a">installation_id</text>
<text x="595" y="243" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#1d4ed8">Int (FK)</text>
<text x="450" y="262" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#1e3a8a">installation</text>
<text x="595" y="262" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#1d4ed8">Installation</text>
<text x="450" y="281" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#1e3a8a">predictions</text>
<text x="595" y="281" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#1d4ed8">Prediction[]</text>

<text x="450" y="304" font-family="Helvetica, Arial, sans-serif" font-size="12" font-style="italic" fill="#64748b">@@map("sites")</text>

<!-- ================= Prediction ================= -->
<rect x="780" y="80" width="330" height="290" rx="12" fill="#fdecee" stroke="#dc2626" stroke-width="1.8"/>
<text x="945" y="112" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="19" font-weight="700" fill="#7f1d1d">Prediction</text>
<line x1="800" y1="126" x2="1090" y2="126" stroke="#dc2626" stroke-width="1" opacity="0.3"/>

<text x="800" y="148" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#7f1d1d">id</text>
<text x="945" y="148" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#b91c1c">Int (PK)</text>
<text x="800" y="167" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#7f1d1d">site_id</text>
<text x="945" y="167" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#b91c1c">String (FK)</text>
<text x="800" y="186" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#7f1d1d">timestamp</text>
<text x="945" y="186" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#b91c1c">String</text>
<text x="800" y="205" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#7f1d1d">capacity_factor</text>
<text x="945" y="205" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#b91c1c">Float</text>
<text x="800" y="224" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#7f1d1d">solar_generation</text>
<text x="945" y="224" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#b91c1c">Float</text>
<text x="800" y="243" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#7f1d1d">fetched_at</text>
<text x="945" y="243" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#b91c1c">DateTime</text>
<text x="800" y="262" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#7f1d1d">site</text>
<text x="945" y="262" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#b91c1c">Site</text>

<text x="800" y="288" font-family="Helvetica, Arial, sans-serif" font-size="12" font-style="italic" fill="#64748b">@@unique([site_id, timestamp])</text>
<text x="800" y="304" font-family="Helvetica, Arial, sans-serif" font-size="12" font-style="italic" fill="#64748b">@@index([site_id, capacity_factor])</text>
<text x="800" y="320" font-family="Helvetica, Arial, sans-serif" font-size="12" font-style="italic" fill="#64748b">@@index([timestamp])</text>
<text x="800" y="336" font-family="Helvetica, Arial, sans-serif" font-size="12" font-style="italic" fill="#64748b">@@index([site_id, timestamp])</text>
<text x="800" y="352" font-family="Helvetica, Arial, sans-serif" font-size="12" font-style="italic" fill="#64748b">@@map("predictions")</text>

<!-- Relationship lines -->
<line x1="330" y1="157" x2="426" y2="157" stroke="#4b5563" stroke-width="2" marker-end="url(#arrow2)"/>
<text x="378" y="147" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#374151">1 : N</text>

<line x1="680" y1="157" x2="776" y2="157" stroke="#4b5563" stroke-width="2" marker-end="url(#arrow2)"/>
<text x="728" y="147" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#374151">1 : N</text>

<!-- ================= Weather ================= -->
<rect x="80" y="410" width="300" height="250" rx="12" fill="#fdf3e3" stroke="#d97706" stroke-width="1.8"/>
<text x="230" y="442" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="19" font-weight="700" fill="#92400e">Weather</text>
<line x1="100" y1="456" x2="360" y2="456" stroke="#d97706" stroke-width="1" opacity="0.3"/>

<text x="100" y="478" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#92400e">id</text>
<text x="260" y="478" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#b45309">Int (PK)</text>
<text x="100" y="497" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#92400e">timestamp</text>
<text x="260" y="497" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#b45309">String (unique)</text>
<text x="100" y="516" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#92400e">temperature</text>
<text x="260" y="516" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#b45309">Float</text>
<text x="100" y="535" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#92400e">relative_humidity</text>
<text x="260" y="535" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#b45309">Float</text>
<text x="100" y="554" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#92400e">cloud_cover</text>
<text x="260" y="554" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#b45309">Float</text>
<text x="100" y="573" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#92400e">shortwave_radiation</text>
<text x="260" y="573" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#b45309">Float</text>
<text x="100" y="592" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#92400e">diffuse_radiation</text>
<text x="260" y="592" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#b45309">Float</text>
<text x="100" y="611" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#92400e">fetched_at</text>
<text x="260" y="611" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#b45309">DateTime</text>

<text x="100" y="637" font-family="Helvetica, Arial, sans-serif" font-size="12" font-style="italic" fill="#64748b">@@map("weather")</text>

<!-- ================= ModelInfo ================= -->
<rect x="430" y="410" width="250" height="270" rx="12" fill="#f1edfc" stroke="#7c3aed" stroke-width="1.8"/>
<text x="555" y="442" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="19" font-weight="700" fill="#4c1d95">ModelInfo</text>
<line x1="450" y1="456" x2="660" y2="456" stroke="#7c3aed" stroke-width="1" opacity="0.3"/>

<text x="450" y="478" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#4c1d95">id</text>
<text x="595" y="478" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#6d28d9">Int (PK)</text>
<text x="450" y="497" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#4c1d95">model</text>
<text x="595" y="497" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#6d28d9">String</text>
<text x="450" y="516" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#4c1d95">r2</text>
<text x="595" y="516" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#6d28d9">Float</text>
<text x="450" y="535" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#4c1d95">mae</text>
<text x="595" y="535" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#6d28d9">Float</text>
<text x="450" y="554" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#4c1d95">train_start</text>
<text x="595" y="554" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#6d28d9">String</text>
<text x="450" y="573" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#4c1d95">train_end</text>
<text x="595" y="573" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#6d28d9">String</text>
<text x="450" y="592" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#4c1d95">features</text>
<text x="595" y="592" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#6d28d9">Json</text>
<text x="450" y="611" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#4c1d95">sites_count</text>
<text x="595" y="611" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#6d28d9">Int</text>
<text x="450" y="630" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#4c1d95">fetched_at</text>
<text x="595" y="630" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#6d28d9">DateTime</text>

<text x="450" y="656" font-family="Helvetica, Arial, sans-serif" font-size="12" font-style="italic" fill="#64748b">@@map("model_info")</text>

</svg>