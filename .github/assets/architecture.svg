<svg viewBox="0 0 820 400" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b"/>
    </marker>
  </defs>

  <!-- Fond blanc global avec border-radius de 16px -->
  <rect width="820" height="400" fill="#ffffff" rx="16"/>

  <!-- solargen-ui (application service) - Bleu médian -->
  <rect x="30" y="140" width="180" height="100" rx="8" fill="none" stroke="#3b82f6" stroke-width="2"/>
  <text x="120" y="180" text-anchor="middle" font-size="15" fill="#3b82f6" font-weight="800">solargen-ui</text>
  <text x="120" y="200" text-anchor="middle" font-size="11" fill="#3b82f6" font-weight="400">React · TypeScript</text>
  <text x="120" y="228" text-anchor="middle" font-size="10" fill="#64748b" font-style="italic">Hostinger</text>

  <!-- solargen-backend (application service) - Émeraude médian -->
  <rect x="280" y="140" width="180" height="100" rx="8" fill="none" stroke="#10b981" stroke-width="2"/>
  <text x="370" y="180" text-anchor="middle" font-size="15" fill="#10b981" font-weight="800">solargen-backend</text>
  <text x="370" y="200" text-anchor="middle" font-size="11" fill="#10b981" font-weight="400">NestJS</text>
  <text x="370" y="228" text-anchor="middle" font-size="10" fill="#64748b" font-style="italic">Northflank</text>

  <!-- solargen-model (application service) - Violet médian -->
  <rect x="530" y="140" width="180" height="100" rx="8" fill="none" stroke="#8b5cf6" stroke-width="2"/>
  <text x="620" y="180" text-anchor="middle" font-size="15" fill="#8b5cf6" font-weight="800">solargen-model</text>
  <text x="620" y="200" text-anchor="middle" font-size="11" fill="#8b5cf6" font-weight="400">FastAPI · LightGBM (ML)</text>
  <text x="620" y="228" text-anchor="middle" font-size="10" fill="#64748b" font-style="italic">Northflank</text>

  <!-- MySQL (data store) - Ambre médian -->
  <rect x="305" y="300" width="130" height="60" rx="8" fill="none" stroke="#f59e0b" stroke-width="2"/>
  <text x="370" y="325" text-anchor="middle" font-size="14" fill="#f59e0b" font-weight="800">MySQL</text>
  <text x="370" y="343" text-anchor="middle" font-size="11" fill="#f59e0b" font-weight="400">Persisted data</text>

  <!-- Open-Meteo (external service) - Gris médian -->
  <rect x="555" y="300" width="130" height="60" rx="8" fill="none" stroke="#64748b" stroke-width="2" stroke-dasharray="5 3"/>
  <text x="620" y="322" text-anchor="middle" font-size="13" fill="#64748b" font-weight="800">Open-Meteo</text>
  <text x="620" y="338" text-anchor="middle" font-size="10" fill="#64748b" font-weight="400">External API</text>

  <!-- Arrows -->
  <line x1="210" y1="190" x2="276" y2="190" stroke="#64748b" stroke-width="1.75" marker-end="url(#arrow)"/>
  <text x="243" y="180" text-anchor="middle" font-size="10" fill="#64748b" font-weight="600">REST</text>

  <line x1="460" y1="190" x2="526" y2="190" stroke="#64748b" stroke-width="1.75" marker-end="url(#arrow)"/>
  <text x="493" y="180" text-anchor="middle" font-size="10" fill="#64748b" font-weight="600">REST</text>

  <line x1="370" y1="240" x2="370" y2="296" stroke="#64748b" stroke-width="1.75" marker-end="url(#arrow)"/>

  <line x1="620" y1="240" x2="620" y2="296" stroke="#64748b" stroke-width="1.75" marker-end="url(#arrow)"/>

  <!-- Cron note (automation) - Indigo médian -->
  <rect x="220" y="60" width="300" height="40" rx="8" fill="none" stroke="#6366f1" stroke-width="2"/>
  <text x="370" y="78" text-anchor="middle" font-size="12" fill="#6366f1" font-weight="800">Daily Cron Job</text>
  <text x="370" y="93" text-anchor="middle" font-size="10" fill="#6366f1" font-weight="400">Fetches today predictions from FastAPI and populates DB</text>

  <line x1="370" y1="100" x2="370" y2="136" stroke="#6366f1" stroke-width="1.75" stroke-dasharray="4 3" marker-end="url(#arrow)"/>
</svg>
