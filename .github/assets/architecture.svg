<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 500" role="img">
<defs>
  <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M0,0 L10,5 L0,10 z" fill="#4b5563"/>
  </marker>
  <marker id="arrow-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M0,0 L10,5 L0,10 z" fill="#c2760a"/>
  </marker>
</defs>

<rect x="0" y="0" width="1400" height="500" rx="16" fill="#ffffff"/>

<g transform="translate(-10,0)">

<!-- solargen-ui -->
<rect x="80" y="100" width="330" height="120" rx="12" fill="#e8f6ef" stroke="#16a34a" stroke-width="1.8"/>
<text x="245" y="132" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="20" font-weight="700" fill="#065f46">solargen-ui</text>
<text x="245" y="156" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#2f7d5c">React · TypeScript</text>
<line x1="100" y1="168" x2="390" y2="168" stroke="#16a34a" stroke-width="1" opacity="0.4"/>
<text x="245" y="190" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="13" font-style="italic" fill="#4b8a6f">Hostinger</text>

<!-- ui -> backend (shortened) -->
<line x1="410" y1="160" x2="502" y2="160" stroke="#4b5563" stroke-width="2" marker-end="url(#arrow)"/>
<text x="456" y="148" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#374151">REST</text>

<g transform="translate(-100,0)">

<!-- Northflank group (backend + model only) -->
<rect x="590" y="40" width="850" height="230" rx="16" fill="none" stroke="#9ca3af" stroke-width="1.5" stroke-dasharray="6 6"/>
<text x="1015" y="70" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="17" font-weight="700" fill="#374151">Dockerized Backend Services</text>
<text x="1015" y="88" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="12" font-style="italic" fill="#6b7280">Hosted on the same internal network on Northflank</text>

<!-- solargen-backend -->
<rect x="610" y="103" width="330" height="140" rx="12" fill="#fdf3e3" stroke="#d97706" stroke-width="1.8"/>
<text x="775" y="139" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="20" font-weight="700" fill="#92400e">solargen-backend</text>
<text x="775" y="163" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#b45309">NestJS</text>

<!-- Cron sub-box -->
<rect x="640" y="179" width="270" height="50" rx="8" fill="none" stroke="#d97706" stroke-width="1.2" stroke-dasharray="4 4"/>
<text x="775" y="200" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#92400e">Daily Cron</text>
<text x="775" y="218" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#a8710a">Every day at 1am</text>

<!-- solargen-model -->
<rect x="1090" y="128" width="330" height="90" rx="12" fill="#f1edfc" stroke="#7c3aed" stroke-width="1.8"/>
<text x="1255" y="166" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="20" font-weight="700" fill="#4c1d95">solargen-model</text>
<text x="1255" y="190" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#6d28d9">FastAPI · LightGBM (ML)</text>

<!-- MySQL -->
<rect x="640" y="370" width="270" height="90" rx="12" fill="#eaf2fc" stroke="#2563eb" stroke-width="1.8"/>
<text x="775" y="408" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="19" font-weight="700" fill="#1e3a8a">MySQL DB</text>
<text x="775" y="432" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#1d4ed8">Persisted data</text>

<!-- Open-Meteo -->
<rect x="1120" y="370" width="270" height="90" rx="12" fill="#fdecee" stroke="#dc2626" stroke-width="1.8"/>
<text x="1255" y="408" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="19" font-weight="700" fill="#7f1d1d">Open-Meteo API</text>
<text x="1255" y="432" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#b91c1c">Weather Historical/Forecast</text>

<!-- backend -> model -->
<line x1="940" y1="173" x2="1082" y2="173" stroke="#4b5563" stroke-width="2" marker-end="url(#arrow)"/>
<text x="1011" y="161" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#374151">REST</text>

<!-- cron -> model (daily trigger) -->
<line x1="910" y1="204" x2="1082" y2="201" stroke="#c2760a" stroke-width="1.8" stroke-dasharray="5 4" marker-end="url(#arrow-amber)"/>
<text x="996" y="196" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="12" font-style="italic" fill="#a8710a">daily trigger</text>

<!-- backend -> mysql -->
<line x1="775" y1="243" x2="775" y2="362" stroke="#4b5563" stroke-width="2" marker-end="url(#arrow)"/>

<!-- model -> open-meteo -->
<line x1="1255" y1="218" x2="1255" y2="362" stroke="#4b5563" stroke-width="2" marker-end="url(#arrow)"/>

</g>
</g>
</svg>